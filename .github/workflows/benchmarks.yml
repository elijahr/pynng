name: Performance Benchmarks

on:
  push:
    paths:
      - 'pynng/**'
      - 'build_pynng.py'
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    paths:
      - 'pynng/**'
      - 'build_pynng.py'
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and uv
        run: |
          python -m pip install --upgrade pip uv

      - name: Stage benchmark harness
        run: |
          mkdir -p /tmp/bench_harness
          cp -r benchmarks/* /tmp/bench_harness/

      # Step 1: Benchmark current branch
      - name: Build and Benchmark Current Branch
        run: |
          uv pip install -e . --no-build-isolation
          python /tmp/bench_harness/bench.py -n 10000 --json current_bench.json

      # Step 2: Checkout base branch and benchmark on the EXACT same VM
      - name: Build and Benchmark Base Branch
        run: |
          BASE_REF="${{ github.base_ref || 'master' }}"
          # If this is a direct push to master, compare against previous commit (HEAD~1)
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "$BASE_REF" ]; then
            BASE_REF="HEAD~1"
          fi
          echo "Comparing against base ref: $BASE_REF"
          if git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            git checkout "$BASE_REF"
            uv pip install -e . --no-build-isolation
            python /tmp/bench_harness/bench.py -n 10000 --json base_bench.json
          else
            echo "Base ref $BASE_REF not found; skipping comparison."
          fi

      # Step 3: Compare results & generate markdown table
      - name: Compare Benchmarks
        id: compare
        run: |
          if [ -f base_bench.json ]; then
            FAIL_ARG=""
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              FAIL_ARG="--fail-on-regression 20"
            fi
            python /tmp/bench_harness/compare.py base_bench.json current_bench.json --output report.md $FAIL_ARG
            cat report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚡ Benchmark Results (Standalone)" >> $GITHUB_STEP_SUMMARY
            echo "Ran on commit \`$(git rev-parse --short HEAD)\`." >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            python -m json.tool current_bench.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # Step 4: Post or update sticky comment on the PR (only if running on a PR and report exists)
      - name: Post PR Benchmark Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('report.md')) return;
            const report = fs.readFileSync('report.md', 'utf8');
            const issue_number = context.issue.number;
            const botHeader = '## ⚡ PyNNG Performance Benchmark Report';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(botHeader)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: report
              });
            }
