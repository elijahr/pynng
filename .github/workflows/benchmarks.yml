name: Performance Benchmarks

on:
  pull_request:
    paths:
      - 'pynng/**'
      - 'build_pynng.py'
      - 'benchmarks/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and uv
        run: |
          python -m pip install --upgrade pip uv

      # Step 1: Benchmark PR head branch
      - name: Build and Benchmark PR Branch
        run: |
          uv pip install -e . --no-build-isolation
          python benchmarks/bench.py -n 10000 --json pr_bench.json

      # Step 2: Checkout base branch (master) and benchmark on the EXACT same VM
      - name: Build and Benchmark Base Branch
        run: |
          BASE_REF="${{ github.base_ref || 'master' }}"
          git checkout "$BASE_REF"
          uv pip install -e . --no-build-isolation
          # Ensure benchmarks/ compare scripts are available from HEAD
          git checkout "${{ github.head_ref || 'HEAD' }}" -- benchmarks/
          python benchmarks/bench.py -n 10000 --json base_bench.json

      # Step 3: Compare results & generate markdown table
      - name: Compare Benchmarks
        id: compare
        run: |
          python benchmarks/compare.py base_bench.json pr_bench.json --output report.md --fail-on-regression 15
          cat report.md >> $GITHUB_STEP_SUMMARY

      # Step 4: Post or update sticky comment on the PR
      - name: Post PR Benchmark Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            const issue_number = context.issue.number;
            const botHeader = '## ⚡ PyNNG Performance Benchmark Report';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(botHeader)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: report
              });
            }
